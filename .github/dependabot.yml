# Weekly version updates for npm packages and the pinned GitHub Actions. Security updates
# also need "Dependabot security updates" turned on under Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so a compromised or broken publish
    # is usually caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # Wrangler and the Vitest plugin ship matching workerd versions; update them together.
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      tooling:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
